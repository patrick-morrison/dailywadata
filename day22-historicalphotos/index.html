<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHARP AR Window Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="ui-overlay">
        <h1>SHARP AR Window</h1>
        <p>A photorealistic 3D window generated from a single image using SHARP.</p>
        <div class="control-group">
            <select id="image-select">
                <option value="">Select an image</option>
            </select>
            <button id="ar-button">Enter AR Mode</button>
            <p id="status-text" style="margin-top: 10px; margin-bottom: 0;">Select an image to start.</p>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js"
        }
    }
    </script>
    <script type="module" src="index.js"></script>
</body>

</html>
